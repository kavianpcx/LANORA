services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      LANORA_LISTEN_ADDR: ${LANORA_LISTEN_ADDR:-:8080}
      LANORA_DB_PATH: ${LANORA_DB_PATH:-/data/lanora.db}
      LANORA_ADMIN_TOKEN: ${LANORA_ADMIN_TOKEN:?Set LANORA_ADMIN_TOKEN in .env}
      LANORA_RELAY_PEER_URL: ${LANORA_RELAY_PEER_URL:?Set LANORA_RELAY_PEER_URL in .env}
      LANORA_ALLOWED_ORIGINS: ${LANORA_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:1420}
    volumes:
      - lanora_data:/data
    expose: ["8080"]
    networks: [private]
  easytier:
    image: ghcr.io/easytier/easytier:v2.7.1@sha256:24248ca25f55f97fde509af450124b31decd44421403518350c6f4109fb139ef
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    command: ["--network-name", "lanora-relay-control", "--network-secret", "${LANORA_RELAY_SECRET:?Set LANORA_RELAY_SECRET in .env}", "--listeners", "tcp://0.0.0.0:11010", "udp://0.0.0.0:11010", "--relay-network-whitelist", "lanora-*"]
    ports:
      - "11010:11010/tcp"
      - "11010:11010/udp"
    networks: [private]
  caddy:
    build:
      context: .
      dockerfile: deploy/docker/caddy.Dockerfile
    restart: unless-stopped
    environment:
      LANORA_PUBLIC_HOST: ${LANORA_PUBLIC_HOST:?Set LANORA_PUBLIC_HOST in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private]
volumes:
  lanora_data:
  caddy_data:
  caddy_config:
networks:
  private:
    driver: bridge
