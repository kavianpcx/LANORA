name: Signed updater installed-to-installed test
on:
  push:
    branches:
      - codex/updater-e2e-alpha0-to-alpha1-20261119
    paths:
      - '.github/workflows/updater-e2e.yml'
      - 'apps/desktop/src/App.tsx'
permissions:
  contents: read
jobs:
  updater-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/api/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned EasyTier v2.6.4
        shell: pwsh
        run: |
          $uri = 'https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-windows-x86_64-v2.6.4.zip'
          Invoke-WebRequest $uri -OutFile easytier.zip
          $actual = (Get-FileHash easytier.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '27af91e270e554709b048bd32327fefd2dfce5062ae1e8701af7550c6f525f84') { throw 'EasyTier archive hash mismatch' }
          Expand-Archive easytier.zip -DestinationPath easytier-extracted
          $dest = 'apps/desktop/src-tauri/resources/easytier'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem easytier-extracted -File -Recurse | ForEach-Object { Copy-Item $_.FullName -Destination $dest -Force }
          if (!(Test-Path "$dest/easytier-core.exe") -or !(Test-Path "$dest/easytier-cli.exe")) { throw 'EasyTier executables are missing' }
          $licenseDir = 'apps/desktop/src-tauri/resources/licenses'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/EasyTier/EasyTier/v2.6.4/LICENSE' -OutFile "$licenseDir/EasyTier-LGPL-3.0.txt"
          Copy-Item THIRD_PARTY_LICENSES.md "$licenseDir/THIRD_PARTY_LICENSES.md"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Bundle font license notices
        shell: pwsh
        run: |
          Copy-Item apps/desktop/node_modules/@fontsource/inter/LICENSE apps/desktop/src-tauri/resources/licenses/Inter-OFL.txt
          Copy-Item apps/desktop/node_modules/@fontsource/vazirmatn/LICENSE apps/desktop/src-tauri/resources/licenses/Vazirmatn-OFL.txt
      - name: Build signed updater-enabled test baseline
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is unavailable to this test workflow.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { throw 'TAURI_UPDATER_PUBLIC_KEY is unavailable to this test workflow.' }
          $config = @{
            version = '0.3.0-alpha.0'
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
                endpoints = @('http://127.0.0.1:8765/latest.json')
                requireSignedVersion = $true
                dangerousInsecureTransportProtocol = $true
                windows = @{ installMode = 'passive' }
              }
            }
          } | ConvertTo-Json -Depth 8 -Compress
          $configPath = Join-Path $env:RUNNER_TEMP 'lanora-updater-e2e-config.json'
          [System.IO.File]::WriteAllText($configPath, $config, [System.Text.UTF8Encoding]::new($false))
          $env:VITE_LANORA_UPDATES_ENABLED = 'true'
          $env:VITE_LANORA_E2E_ENABLED = 'true'
          npm run tauri build -- --bundles nsis --config $configPath
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -File | Where-Object { $_.Name -like '*0.3.0-alpha.0*' } | Select-Object -First 1
          if (!$installer) { throw 'Signed alpha.0 test installer was not produced.' }
          if (!(Test-Path "$($installer.FullName).sig")) { throw 'Tauri did not produce the signed baseline artifact.' }
          $baselineDir = Join-Path $env:RUNNER_TEMP 'lanora-alpha0-baseline'
          New-Item -ItemType Directory -Force -Path $baselineDir | Out-Null
          $baselineInstaller = Join-Path $baselineDir $installer.Name
          Copy-Item $installer.FullName $baselineInstaller
          Copy-Item "$($installer.FullName).sig" "$baselineInstaller.sig"
          "LANORA_E2E_BASELINE_INSTALLER=$baselineInstaller" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          $targetConfig = $config.Replace('0.3.0-alpha.0', '0.3.0-alpha.2')
          $targetConfigPath = Join-Path $env:RUNNER_TEMP 'lanora-updater-e2e-target-config.json'
          [System.IO.File]::WriteAllText($targetConfigPath, $targetConfig, [System.Text.UTF8Encoding]::new($false))
          npm run tauri build -- --bundles nsis --config $targetConfigPath
          $targetInstaller = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -File | Where-Object { $_.Name -like '*0.3.0-alpha.2*' } | Select-Object -First 1
          if (!$targetInstaller) { throw 'Signed alpha.2 test target installer was not produced.' }
          if (!(Test-Path "$($targetInstaller.FullName).sig")) { throw 'Tauri did not produce the signed update target.' }
      - name: Prepare signed alpha.2 test target and local manifest
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'lanora-update-e2e'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $targetName = 'LANORA_0.3.0-alpha.2_x64-setup.exe'
          $builtTarget = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/release/bundle/nsis/LANORA_0.3.0-alpha.2_x64-setup.exe'
          if (!(Test-Path $builtTarget)) { throw 'The signed alpha.2 test target installer is missing.' }
          Copy-Item $builtTarget (Join-Path $assetDir $targetName)
          Copy-Item "$builtTarget.sig" (Join-Path $assetDir ($targetName + '.sig'))
          $signature = [System.IO.File]::ReadAllText((Join-Path $assetDir ($targetName + '.sig'))).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Signed test target signature is empty.' }
          $manifest = @{
            version = '0.3.0-alpha.2'
            notes = 'Temporary loopback test manifest. No release asset is modified.'
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                url = "http://127.0.0.1:8765/$targetName"
                signature = 'invalid-signature-for-rejection-test'
              }
            }
          } | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText((Join-Path $assetDir 'latest.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          "LANORA_E2E_DIR=$assetDir" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "LANORA_E2E_TARGET_NAME=$targetName" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
      - name: Start isolated LANORA API for installed client
        shell: pwsh
        run: |
          $env:LANORA_LISTEN_ADDR = '127.0.0.1:8080'
          $env:LANORA_DB_PATH = Join-Path $env:RUNNER_TEMP 'lanora-updater-e2e.sqlite'
          $env:LANORA_ALLOWED_ORIGINS = 'tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:1420'
          $stdout = Join-Path $env:RUNNER_TEMP 'lanora-api.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'lanora-api.stderr.log'
          $api = Start-Process -FilePath (Get-Command go).Source -ArgumentList @('run', './cmd/lanora-api') -WorkingDirectory "$env:GITHUB_WORKSPACE/services/api" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "LANORA_API_PID=$($api.Id)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          $ready = $false
          for ($i = 0; $i -lt 80; $i++) {
            try {
              $health = Invoke-RestMethod 'http://127.0.0.1:8080/api/v1/health'
              if ($health.status -eq 'ok') { $ready = $true; break }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (!$ready) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 40 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 40 }
            throw 'Isolated LANORA API did not become healthy.'
          }
      # The prior run showed that the app and WebView2 stayed alive without a 9223 listener.
      # Available evidence identifies the CDP dependency as the harness failure; it does not identify
      # why WebView2 ignored the debugging flags. This test uses UI Automation and no debugging port.
      - name: Test installed client and signed update with Windows UI Automation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script:stage = 'initialize test report'
          $script:results = [System.Collections.Generic.List[string]]::new()
          $script:passed = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $script:failed = $false
          function Report-Pass([string]$message) {
            $line = "PASS: $message"
            Write-Output $line
            $script:results.Add($line)
            [void]$script:passed.Add($message)
          }
          function Get-LanoraWindow {
            foreach ($process in @(Get-Process -Name 'lanora-desktop' -ErrorAction SilentlyContinue)) {
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
                try { return [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle) } catch {}
              }
            }
            return $null
          }
          function Get-UiElements {
            $window = Get-LanoraWindow
            if ($null -eq $window) { return @() }
            try { return $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) } catch { return @() }
          }
          function Find-UiElement([string[]]$names, [string]$controlType, [bool]$exact = $false) {
            foreach ($element in @(Get-UiElements)) {
              try {
                if ($controlType -and $element.Current.ControlType.ProgrammaticName -ne $controlType) { continue }
                $accessibleName = $element.Current.Name
                foreach ($candidate in $names) {
                  if (($exact -and $accessibleName -eq $candidate) -or (!$exact -and $accessibleName.IndexOf($candidate, [StringComparison]::OrdinalIgnoreCase) -ge 0)) {
                    return $element
                  }
                }
              } catch {}
            }
            return $null
          }
          function Wait-UiElement([string[]]$names, [string]$controlType, [int]$timeoutSeconds = 20, [bool]$exact = $false) {
            $deadline = [DateTime]::UtcNow.AddSeconds($timeoutSeconds)
            while ([DateTime]::UtcNow -lt $deadline) {
              $element = Find-UiElement $names $controlType $exact
              if ($null -ne $element) { return $element }
              Start-Sleep -Milliseconds 200
            }
            throw 'Expected accessible UI control was not available.'
          }
          function Invoke-UiElement($element) {
            $pattern = $element.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $pattern.Invoke()
          }
          function Set-UiValue($element, [string]$value) {
            $element.SetFocus()
            $pattern = $element.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $pattern.SetValue($value)
          }
          function Get-LanoraState {
            foreach ($element in @(Get-UiElements)) {
              try {
                $name = $element.Current.Name
                $prefix = 'LANORA_E2E_STATE:'
                $index = $name.IndexOf($prefix, [StringComparison]::Ordinal)
                if ($index -ge 0) {
                  $json = $name.Substring($index + $prefix.Length)
                  return ($json | ConvertFrom-Json)
                }
              } catch {}
            }
            return $null
          }
          function Wait-LanoraState([scriptblock]$condition, [int]$timeoutSeconds = 30) {
            $deadline = [DateTime]::UtcNow.AddSeconds($timeoutSeconds)
            while ([DateTime]::UtcNow -lt $deadline) {
              $state = Get-LanoraState
              if ($null -ne $state -and (& $condition $state)) { return $state }
              Start-Sleep -Milliseconds 250
            }
            throw 'Expected sanitized LANORA test state was not observed.'
          }
          function Write-TestManifest([string]$signature) {
            $manifest = @{
              version = '0.3.0-alpha.2'
              notes = 'Temporary loopback updater test. Does not modify GitHub Releases.'
              pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = @{
                'windows-x86_64' = @{
                  url = "http://127.0.0.1:8765/$($env:LANORA_E2E_TARGET_NAME)"
                  signature = $signature
                }
              }
            } | ConvertTo-Json -Depth 8 -Compress
            [System.IO.File]::WriteAllText((Join-Path $env:LANORA_E2E_DIR 'latest.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          }
          function Add-NotVerified([string]$message) {
            $line = "NOT VERIFIED: $message"
            Write-Output $line
            $script:results.Add($line)
          }
          try {
            $script:stage = 'install signed alpha.0 baseline'
            $baseline = $env:LANORA_E2E_BASELINE_INSTALLER
            if (!(Test-Path $baseline)) { throw 'baseline artifact missing' }
            $destination = Join-Path $env:RUNNER_TEMP 'LANORA-Updater-E2E'
            $install = Start-Process -FilePath $baseline -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw 'baseline installer returned a failure code' }
            $app = Get-ChildItem $destination -Filter 'lanora-desktop.exe' -Recurse | Select-Object -First 1
            if (!$app) { throw 'installed baseline executable missing' }
            Report-Pass 'signed alpha.0 baseline installed'

            $script:stage = 'prepare local signed updater endpoint'
            $target = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/release/bundle/nsis/LANORA_0.3.0-alpha.2_x64-setup.exe'
            $signaturePath = "$target.sig"
            if (!(Test-Path $target) -or !(Test-Path $signaturePath)) { throw 'signed alpha.2 target or signature missing' }
            $goodSignature = [System.IO.File]::ReadAllText($signaturePath).Trim()
            if ($goodSignature.Length -lt 100) { throw 'signed target sidecar is unexpectedly short' }
            $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($goodSignature))
            $rows = $decoded -split '\r?\n'
            $signatureRow = -1
            for ($i = $rows.Length - 1; $i -ge 0; $i--) {
              if ([regex]::IsMatch($rows[$i], '^[A-Za-z0-9+/=]{20,}$')) { $signatureRow = $i; break }
            }
            if ($signatureRow -lt 0) { throw 'signature sidecar payload could not be parsed' }
            $rows[$signatureRow] = $(if ($rows[$signatureRow][0] -eq 'A') { 'B' } else { 'A' }) + $rows[$signatureRow].Substring(1)
            $badSignature = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes(($rows -join [Environment]::NewLine)))
            Write-TestManifest $badSignature

            $nodeServer = Join-Path $env:RUNNER_TEMP 'lanora-updater-e2e-server.cjs'
            $nodeSource = @'
          const fs = require('node:fs');
          const http = require('node:http');
          const path = require('node:path');
          const root = process.argv[2];
          const server = http.createServer((req, res) => {
            const name = path.basename(new URL(req.url, 'http://127.0.0.1').pathname);
            if (name === 'health') { res.writeHead(200); res.end('ok'); return; }
            const file = path.join(root, name);
            let stat;
            try { stat = fs.statSync(file); } catch { res.writeHead(404); res.end('not found'); return; }
            res.writeHead(200, {
              'Content-Length': stat.size,
              'Content-Type': name.endsWith('.json') ? 'application/json' : 'application/octet-stream',
              'Cache-Control': 'no-store'
            });
            const stream = fs.createReadStream(file, { highWaterMark: 262144 });
            stream.on('data', chunk => {
              res.write(chunk);
              stream.pause();
              setTimeout(() => stream.resume(), 60);
            });
            stream.on('end', () => res.end());
            stream.on('error', () => res.destroy());
          });
          server.listen(8765, '127.0.0.1');
          '@
            [System.IO.File]::WriteAllText($nodeServer, $nodeSource, [System.Text.UTF8Encoding]::new($false))
            $nodeOut = Join-Path $env:RUNNER_TEMP 'lanora-updater-server.stdout.log'
            $nodeErr = Join-Path $env:RUNNER_TEMP 'lanora-updater-server.stderr.log'
            $serverProcess = Start-Process -FilePath (Get-Command node).Source -ArgumentList @($nodeServer, $env:LANORA_E2E_DIR) -PassThru -WindowStyle Hidden -RedirectStandardOutput $nodeOut -RedirectStandardError $nodeErr
            "LANORA_E2E_SERVER_PID=$($serverProcess.Id)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
            $serverReady = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $ready = Invoke-WebRequest 'http://127.0.0.1:8765/health' -TimeoutSec 2
                if ($ready.StatusCode -eq 200) { $serverReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (!$serverReady) { throw 'loopback update server did not start' }
            Report-Pass 'isolated loopback update server ready'

            $script:stage = 'start installed alpha.0 client'
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $appProcess = Start-Process -FilePath $app.FullName -PassThru
            $profileName = Wait-UiElement @('Display name', 'Enter a display name') 'ControlType.Edit' 45
            Set-UiValue $profileName 'Updater QA'
            $english = Wait-UiElement @('English') 'ControlType.Button' 10
            Invoke-UiElement $english
            $light = Wait-UiElement @('Light') 'ControlType.Button' 10
            Invoke-UiElement $light
            $continue = Wait-UiElement @('Continue') 'ControlType.Button' 10
            Invoke-UiElement $continue
            $connectLater = Wait-UiElement @('Connect later') 'ControlType.Button' 10
            Invoke-UiElement $connectLater
            $state = Wait-LanoraState { param($s) $s.version -eq '0.3.0-alpha.0' } 30
            Report-Pass 'installed alpha.0 client launched with UI Automation'

            $script:stage = 'connect installed alpha.0 client to local LANORA API'
            $serverInput = Wait-UiElement @('Your server') 'ControlType.Edit' 15
            Set-UiValue $serverInput 'http://127.0.0.1:8080'
            $connect = Wait-UiElement @('Connect to network') 'ControlType.Button' 10
            Invoke-UiElement $connect
            $state = Wait-LanoraState { param($s) ($s.serverReachable -eq $true) -and ($s.connectedServer -eq 'http://127.0.0.1:8080') } 30
            Report-Pass 'installed alpha.0 client connected to the isolated local API'
            $cancel = Find-UiElement @('Cancel') 'ControlType.Button' $true
            if ($null -ne $cancel) { Invoke-UiElement $cancel }

            $script:stage = 'reject invalid update signature'
            $updateButton = Wait-UiElement @('Check for Updates') 'ControlType.Button' 20
            Invoke-UiElement $updateButton
            $menuCheck = Wait-UiElement @('Check for Updates') 'ControlType.Button' 10 $true
            Invoke-UiElement $menuCheck
            $state = Wait-LanoraState { param($s) $s.updateState -eq 'available' } 40
            $installButton = Wait-UiElement @('Install update') 'ControlType.Button' 15
            Invoke-UiElement $installButton
            $state = Wait-LanoraState { param($s) ($s.updateState -eq 'failed') -and ($s.version -eq '0.3.0-alpha.0') } 60
            Report-Pass 'invalid signature rejected and alpha.0 remained installed'
            $later = Find-UiElement @('Later') 'ControlType.Button' $true
            if ($null -ne $later) { Invoke-UiElement $later }

            $script:stage = 'download and install correctly signed alpha.2'
            Write-TestManifest $goodSignature
            Start-Sleep -Milliseconds 500
            $updateButton = Wait-UiElement @('Check for Updates') 'ControlType.Button' 20
            Invoke-UiElement $updateButton
            $menuCheck = Wait-UiElement @('Check for Updates') 'ControlType.Button' 10 $true
            Invoke-UiElement $menuCheck
            $state = Wait-LanoraState { param($s) $s.updateState -eq 'available' } 40
            if ($state.version -ne '0.3.0-alpha.0') { throw 'baseline version changed before valid update' }
            $traceStart = @($state.updateStates).Count
            $installButton = Wait-UiElement @('Install update') 'ControlType.Button' 15
            Invoke-UiElement $installButton
            $maxPercent = 0
            $downloadReceived = 0
            $downloadTotal = 0
            $lastState = $null
            $updateDeadline = [DateTime]::UtcNow.AddMinutes(4)
            while ([DateTime]::UtcNow -lt $updateDeadline) {
              $snapshot = Get-LanoraState
              if ($null -ne $snapshot) {
                $lastState = $snapshot
                if ($snapshot.maxDownloadPercent -ne $null) { $maxPercent = [Math]::Max($maxPercent, [int]$snapshot.maxDownloadPercent) }
                if ($snapshot.downloadReceived -ne $null) { $downloadReceived = [Math]::Max($downloadReceived, [long]$snapshot.downloadReceived) }
                if ($snapshot.downloadTotal -ne $null) { $downloadTotal = [Math]::Max($downloadTotal, [long]$snapshot.downloadTotal) }
                $tail = @($snapshot.updateStates | Select-Object -Skip $traceStart)
                if ($snapshot.updateState -eq 'failed') { throw 'valid signed update reported failure' }
                if ($tail -contains 'restarting') { break }
              }
              Start-Sleep -Milliseconds 250
            }
            if ($null -eq $lastState) { throw 'client state disappeared before update telemetry was captured' }
            $updateTrace = @($lastState.updateStates | Select-Object -Skip $traceStart)
            $expectedStates = @('downloading', 'verifying', 'installing', 'restarting')
            $nextState = 0
            foreach ($observedState in $updateTrace) {
              if ($nextState -lt $expectedStates.Length -and $observedState -eq $expectedStates[$nextState]) { $nextState++ }
            }
            if ($nextState -ne $expectedStates.Length) { throw 'required ordered updater states were not all observed' }
            if ($downloadReceived -le 0 -or $downloadTotal -le 0 -or $maxPercent -lt 100) { throw 'real download byte progress did not reach the known total' }
            Report-Pass 'signed update reported actual download bytes and 100 percent progress'
            Report-Pass 'signed update emitted downloading, verifying, installing and restarting states in order'

            $script:stage = 'confirm relaunch on installed alpha.2 and settings persistence'
            $state = Wait-LanoraState { param($s) ($s.version -eq '0.3.0-alpha.2') -and ($s.updateState -eq 'installed') } 120
            if ($state.playerName -ne 'Updater QA' -or $state.language -ne 'en' -or $state.theme -ne 'light' -or $state.avatar -ne 'fox' -or $state.serverInput -ne 'http://127.0.0.1:8080') {
              throw 'one or more saved preferences changed during installation'
            }
            $versionButton = Wait-UiElement @('0.3.0-alpha.2') 'ControlType.Button' 15
            Report-Pass 'new process confirmed installed alpha.2 after updater relaunch'
            Report-Pass 'display name, avatar, language, theme and server setting survived the update'
            $later = Find-UiElement @('Later') 'ControlType.Button' $true
            if ($null -ne $later) { Invoke-UiElement $later }

            $script:stage = 'reconnect installed alpha.2 client to local LANORA API'
            $serverInput = Wait-UiElement @('Your server') 'ControlType.Edit' 15
            Set-UiValue $serverInput 'http://127.0.0.1:8080'
            $connect = Wait-UiElement @('Connect to network') 'ControlType.Button' 10
            Invoke-UiElement $connect
            $state = Wait-LanoraState { param($s) ($s.version -eq '0.3.0-alpha.2') -and ($s.serverReachable -eq $true) -and ($s.connectedServer -eq 'http://127.0.0.1:8080') } 30
            Report-Pass 'installed alpha.2 client reconnected to the isolated local API'

            $script:stage = 'complete test report'
          } catch {
            $script:failed = $true
            $exceptionType = $_.Exception.GetType().Name
            $line = "FAIL: $($script:stage) (sanitized error type: $exceptionType)"
            Write-Output $line
            $script:results.Add($line)
            foreach ($check in @(
              'installed alpha.0 client connected to the isolated local API',
              'invalid signature rejected and alpha.0 remained installed',
              'signed update reported actual download bytes and 100 percent progress',
              'signed update emitted downloading, verifying, installing and restarting states in order',
              'new process confirmed installed alpha.2 after updater relaunch',
              'display name, avatar, language, theme and server setting survived the update',
              'installed alpha.2 client reconnected to the isolated local API'
            )) {
              if (!$script:passed.Contains($check)) { Add-NotVerified $check }
            }
          } finally {
            $summary = @('## Installed Windows updater test', '')
            $summary += $script:results
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8
          }
          if ($script:failed) { exit 1 }
      - name: Stop temporary processes
        if: always()
        shell: pwsh
        run: |
          if ($env:LANORA_E2E_SERVER_PID) { Stop-Process -Id ([int]$env:LANORA_E2E_SERVER_PID) -Force -ErrorAction SilentlyContinue }
          if ($env:LANORA_API_PID) { Stop-Process -Id ([int]$env:LANORA_API_PID) -Force -ErrorAction SilentlyContinue }
          Get-Process lanora-api, lanora-desktop -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

