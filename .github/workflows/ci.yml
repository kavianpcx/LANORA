name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/api/go.mod
      - run: go test -race ./...
        working-directory: services/api
  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/setup-server.sh scripts/server.sh tests/compose_smoke.sh
      - run: python3 tests/server_commands_test.py
      - run: bash tests/compose_smoke.sh
      - if: always()
        run: docker compose down
