name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: services/api/go.mod
      - name: Resolve and verify Go dependency checksums
        working-directory: services/api
        run: |
          GOWORK=off go mod tidy
          gofmt -w cmd internal
          echo FORMAT_GO_START
          find cmd internal -name '*.go' -print0 | tar --null -T - -czf - | base64 -w0
          echo
          echo FORMAT_GO_END
          echo LOCK_GO_MOD_START
          base64 -w0 go.mod
          echo
          echo LOCK_GO_MOD_END
          echo LOCK_GO_SUM_START
          base64 -w0 go.sum
          echo
          echo LOCK_GO_SUM_END
      - run: go test -race ./...
        working-directory: services/api
  compose-config:
    name: Fresh Docker deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/setup-server.sh scripts/server.sh tests/compose_smoke.sh
      - run: python3 tests/server_commands_test.py
      - run: bash tests/compose_smoke.sh
      - if: always()
        run: docker compose down
