[package]
name = "lanora-desktop"
version = "0.2.0-alpha.6"
description = "LANORA virtual LAN client"
authors = ["LANORA"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "sync", "time"] }
url = "2"
