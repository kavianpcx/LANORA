[package]
name = "lanora-desktop"
version = "0.1.0"
description = "LANORA virtual LAN client"
authors = ["LANORA"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["process", "sync"] }
url = "2"
